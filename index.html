<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Prompt Architect Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .magic-btn { background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); }
        .history-card { background: rgba(255, 255, 255, 0.05); border-radius: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; }
        .history-card:active { background: rgba(255, 255, 255, 0.1); }
        button:active { transform: scale(0.96); opacity: 0.9; }
        input { font-size: 16px !important; }
        .gradient-text { background: linear-gradient(to right, #60a5fa, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-4 pb-12">

    <div class="max-w-md mx-auto">
        <div class="text-center mt-4 mb-6">
            <h1 class="text-3xl font-extrabold gradient-text">PROMPT ARCHITECT</h1>
            <p id="ui-subtitle" class="text-slate-500 text-[10px] tracking-[3px] uppercase mt-1">Professional Generator</p>
        </div>

        <div class="glass p-6 rounded-[2.5rem] mb-6 shadow-2xl border-t border-white/20">
            <div id="finalPrompt" class="text-xl mb-8 min-h-[120px] leading-snug font-semibold text-slate-100 italic">
                Waiting for magic...
            </div>
            
            <div class="grid grid-cols-1 gap-4">
                <button onclick="magicGenerate()" class="magic-btn w-full py-5 rounded-2xl font-black text-xl shadow-lg uppercase tracking-wider text-white">Magic Generate ✨</button>
                <button onclick="copyPrompt()" class="bg-slate-800 w-full py-4 rounded-2xl font-bold text-lg border border-slate-700 text-slate-200">Copy Result 📋</button>
            </div>
        </div>

        <div class="glass p-5 rounded-2xl mb-8">
            <label id="ui-h-input" class="block text-xs font-bold text-blue-400 mb-3 uppercase tracking-widest">Main Concept</label>
            <input type="text" id="userInput" placeholder="Enter word..." 
            class="w-full bg-slate-900/80 border border-slate-700 p-5 rounded-xl text-white outline-none focus:border-purple-500 shadow-inner">
        </div>

        <div id="historyBox" class="hidden">
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 id="ui-h-history" class="text-slate-400 text-sm font-bold uppercase tracking-widest text-xs">Recent Masterpieces</h3>
                <button onclick="clearAll()" class="text-[10px] text-red-500 font-bold uppercase p-2">Clear All</button>
            </div>
            <div id="historyList">
                </div>
        </div>
    </div>

    <script>
        // PUN MASIVNI REČNIK IZ PRETHODNIH KORAKA
        const db = {
            actions: [
                "exploring ancient neon ruins in a deep digital jungle", "floating in a zero-gravity botanical sanctuary",
                "walking through a heavy futuristic rainstorm in Neo-Tokyo", "surrounded by swirling ethereal spirits and magic dust",
                "standing on the edge of a cosmic black hole horizon", "dissolving into a million glowing digital butterflies",
                "captured in a moment of extreme kinetic energy and speed", "meditating inside a giant crystal cathedral",
                "sprinting through a steampunk industrial city at sunset", "melting into a pool of liquid iridescent chrome",
                "shrouded in mysterious volumetric fog and cinematic shadows", "performing an ancient ritual with glowing embers",
                "flying through a nebula made of liquid silk and stars", "emerging from a 90s vintage television glitch screen",
                "submerged in a high-tech underwater laboratory", "frozen in time during a massive explosion of neon flowers"
            ],
            styles: [
                "Unreal Engine 5.4 photorealistic render", "8k UHD cinematic film scan, Kodak Portra 400",
                "Studio Ghibli aesthetic, lush hand-painted scenery", "Cyberpunk 2077 neon-noir aesthetic",
                "Intricate dark fantasy, oil on canvas, Greg Rutkowski style", "Minimalist 3D isometric vector art",
                "Anamorphic widescreen cinematography, 35mm lens", "Hyper-detailed claymation and stop-motion style",
                "Surrealist masterpiece by Salvador Dali", "Retro-futurism, 1950s pulp sci-fi magazine cover",
                "National Geographic documentary style, raw footage", "Futuristic architecture, Zaha Hadid style",
                "Glitch art, VHS aesthetic, vaporwave colors", "Renaissance marble sculpture, dramatic lighting"
            ],
            lighting: [
                "golden hour sunlight with natural lens flare", "cinematic rim lighting, high contrast noir",
                "bioluminescent glow from organic neon sources", "soft diffused high-end studio lighting",
                "dramatic top-down moody cinematic shadows", "volumetric sunbeams filtering through dust particles",
                "neon pink and cyan dual lighting setup", "underwater caustic light reflections",
                "warm flickering candlelight with deep shadows"
            ],
            cameras: [
                "shot on IMAX 70mm camera", "GoPro POV wide angle action shot", "low angle heroic cinematic perspective",
                "extreme close-up macro photography", "drone footage from 400ft altitude", "35mm vintage film photography"
            ]
        };

        const userLang = (navigator.language || navigator.userLanguage).split('-')[0];
        const t = (userLang === 'sr' || userLang === 'hr' || userLang === 'bs') ? {
            wait: "Ukucaj reč i klikni Magic...", alert: "Kopirano!", placeholder: "Npr: Robot, Zmaj, Grad...", history: "Istorija"
        } : {
            wait: "Type a word and hit Magic...", alert: "Copied!", placeholder: "e.g. Robot, Dragon, City...", history: "History"
        };

        document.getElementById('userInput').placeholder = t.placeholder;
        document.getElementById('finalPrompt').innerText = t.wait;

        function magicGenerate() {
            const input = document.getElementById('userInput').value;
            if(!input) {
                alert(userLang === 'sr' ? "Unesite reč!" : "Please enter a word!");
                return;
            }

            const action = db.actions[Math.floor(Math.random() * db.actions.length)];
            const style = db.styles[Math.floor(Math.random() * db.styles.length)];
            const light = db.lighting[Math.floor(Math.random() * db.lighting.length)];
            const cam = db.cameras[Math.floor(Math.random() * db.cameras.length)];

            const final = `${input}, ${action}, ${style}, ${light}, ${cam}, --ar 16:9 --v 6.0 --stylize 300`;
            
            const display = document.getElementById('finalPrompt');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = final;
                display.style.opacity = 1;
            }, 100);

            saveToStorage(final);
        }

        function copyPrompt() {
            const txt = document.getElementById('finalPrompt').innerText;
            if(txt === t.wait) return;
            navigator.clipboard.writeText(txt);
            alert(t.alert);
        }

        // HISTORY & STORAGE LOGIC
        function saveToStorage(text) {
            let history = JSON.parse(localStorage.getItem('prompts')) || [];
            // Spreči duplikate jedan za drugim
            if(history[0] === text) return;
            history.unshift(text);
            localStorage.setItem('prompts', JSON.stringify(history.slice(0, 15)));
            renderHistory();
        }

        function deleteItem(index) {
            let history = JSON.parse(localStorage.getItem('prompts')) || [];
            history.splice(index, 1);
            localStorage.setItem('prompts', JSON.stringify(history));
            renderHistory();
        }

        function clearAll() {
            if(confirm(userLang === 'sr' ? "Obrisati sve?" : "Clear all?")) {
                localStorage.removeItem('prompts');
                renderHistory();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('prompts')) || [];
            const box = document.getElementById('historyBox');
            const list = document.getElementById('historyList');
            
            if(history.length > 0) box.classList.remove('hidden');
            else box.classList.add('hidden');

            list.innerHTML = history.map((item, i) => `
                <div class="history-card p-4 flex justify-between items-center gap-3">
                    <div class="truncate text-xs text-slate-400 flex-1" onclick="copySpecific('${item}')">
                        ${item}
                    </div>
                    <button onclick="deleteItem(${i})" class="w-10 h-10 flex items-center justify-center bg-red-500/10 text-red-500 rounded-xl font-bold">✕</button>
                </div>
            `).join('');
        }

        function copySpecific(text) {
            navigator.clipboard.writeText(text);
            alert(t.alert);
        }

        renderHistory();
    </script>
</body>
</html>
